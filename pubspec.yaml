publish_to: none
version: 1.0.1+8

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: ^12.0.0-beta.7
  cryptography: ^2.7.0
  flutter_secure_storage: ^11.0.0
  image_picker: ^1.1.2
  in_app_purchase: ^3.2.3
  intl: ^0.20.2
  http: ^1.6.0
  path_provider: ^2.1.6
  share_plus: ^13.2.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
